# ===============================
# ConnectCRM Backend Configuration
# ===============================
spring.application.name=connectcrm-backend
server.port=8080

# ---- H2 (default, zero-setup) database ----
# Switch to MySQL by commenting out the H2 block below and
# uncommenting the MySQL block further down.
spring.datasource.url=jdbc:h2:file:./data/connectcrm;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- MySQL configuration (uncomment to use MySQL instead of H2) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/connectcrm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
